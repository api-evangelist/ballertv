aid: ballertv
name: BallerTV
description: 'BallerTV (Baller, Inc.) is a Pasadena, California sports media company
  that live streams and provides on-demand replays and highlights of youth and amateur
  sports, including basketball, volleyball, soccer, lacrosse, softball, and football,
  from thousands of tournaments and showcases nationwide. Subscribers range from families
  following athletes to NCAA and professional scouts using the footage for recruiting
  and scouting. The platform includes a Game Finder for locating events, purchasable
  athlete highlight reels, and BTVision, an AI-powered ball-tracking streaming technology
  that improves the basketball viewing experience. BallerTV is a consumer streaming
  product delivered through its website and iOS/Android apps; it does not publish a
  public developer API or SDK program. This profile was surfaced as an index-ventures
  portfolio company and enriched from public web sources.'
